name: SonarCloud Front

on:
  push:
    branches:
      - main
    paths:
      - front/**
      - .github/workflows/sonarcloud-front.yml
  pull_request:
    branches:
      - main
    paths:
      - front/**
      - .github/workflows/sonarcloud-front.yml

jobs:
  sonarcloud-front:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./front

      - name: Run frontend tests with coverage
        run: npm run test -- --watch=false --browsers=ChromeHeadless --code-coverage
        working-directory: ./front

      - name: SonarCloud scan for frontend
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY_FRONT }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.sources=front/src
            -Dsonar.test.inclusions=front/src/**/*.spec.ts,front/src/test.ts
            -Dsonar.javascript.lcov.reportPaths=front/coverage/bobapp/lcov.info
            -Dsonar.exclusions=**/node_modules/**,**/dist/**